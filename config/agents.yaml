# Maps each agent to its system prompt, the Strands tools it is granted directly,
# and the Agent Skills (SKILL.md packages under ./skills/) it can activate on demand.
# Keeping this declarative makes it easy to audit which agent can do what.

extraction_agent:
  description: Extracts structured fields and summaries from submitted documents.
  tools: [document_tools]
  skills: [document-extraction]

embedding_agent:
  description: Indexes the complete extracted document bundle in the local Chroma vector database.
  tools: [embedding_tools]
  skills: [embedding-storage]

validation_agent:
  description: Checks completeness and authenticity indicators on extracted data.
  tools: [validation_tools, verification_tools]
  skills: [completeness-validation]

scoring_agent:
  description: Applies configurable rules and explainable ML scoring to applications.
  tools: [scoring_tools]
  skills: [explainable-scoring]

workflow_agent:
  description: Routes cases to reviewers and manages audit trail; never finalizes decisions.
  tools: [workflow_tools]
  skills: [reviewer-workflow]

orchestrator_agent:
  description: Coordinates the extraction -> validation -> scoring -> workflow pipeline.
  tools: []
  skills: []
